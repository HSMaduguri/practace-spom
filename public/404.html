    <title>practACE — Redirecting...</title>
    <script>
      // Single Page App fallback for GitHub Pages
      // Redirects back to the root of the repo/site while preserving any hash or query
      const pathSegments = window.location.pathname.split('/');
      // In GitHub Pages, path is /<repo-name>/...
      // Redirect to the repository root directory
      window.location.replace(window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1));
    </script>
  </head>
